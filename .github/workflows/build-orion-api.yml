# Construit l'image du backend ORION et la pousse sur GHCR.
#
# Ce workflow manquait : le role Ansible `services` tire `ghcr.io/hexanexus28/orion-api`,
# une image qui n'a JAMAIS ete construite (404 verifie le 2026-08-25). C'est le chainon
# manquant du deploiement — sans lui, le role echoue et /opt/orion reste vide.
#
# Declencheur sur main UNIQUEMENT : le travail se fait en branche, mais seule une image
# issue de main a vocation a etre deployee. Une branche produisait un second build inutile.
#
# Le build se fait ICI, pas sur le VPS : compiler du .NET sur une machine qui heberge un
# site en production, c'est lui prendre du CPU pour rien. Le VPS ne fait que tirer l'image.
name: Build & push orion-api

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-orion-api.yml'
  workflow_dispatch:   # declenchement manuel : indispensable pour un premier build

concurrency:
  group: orion-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publier sur GHCR ; GITHUB_TOKEN suffit, aucun secret a creer

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` UNIQUEMENT depuis main : sinon une branche de travail ecraserait l'image
      # que le VPS tire en production. Les autres branches produisent un tag nomme, et
      # `sha-xxxxxxx` permet un rollback precis (cf. stacks[].tag dans l'infra).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hexanexus28/orion-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub : un build .NET complet prend plusieurs minutes, les suivants
          # ne recompilent que ce qui a change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Recapitulatif
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
